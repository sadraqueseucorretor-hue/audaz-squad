# AudazSquad na VPS — servido por path em audazimob.com/squad.
# O frontend (Vite build) é estático, servido direto pelo nginx; /squad/api é
# proxy reverso para o backend em Docker (uvicorn em 127.0.0.1:8020).
#
# NÃO é um server block próprio: estes "location" entram DENTRO do server {}
# existente do audazimob.com (o mesmo que já serve o AudazCenter). Cole os
# blocos abaixo nesse server, ajuste o caminho do dist se necessário, e rode:
#   sudo nginx -t && sudo systemctl reload nginx

# --- API: /squad/api/... -> backend /api/... (remove o prefixo /squad) ---
location /squad/api/ {
    proxy_pass http://127.0.0.1:8020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20M;   # cadastros com logo/foto em data URL
}

# --- Assets do Vite (nome com hash) podem ser cacheados agressivamente ---
location /squad/assets/ {
    alias /opt/audaz-squad/frontend/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# --- Frontend (SPA, HashRouter) ---
location /squad/ {
    alias /opt/audaz-squad/frontend/dist/;
    try_files $uri /squad/index.html;
}

# (Opcional) Swagger do FastAPI. Para funcionar 100% atrás de /squad, o app
# precisa de root_path="/squad"; sem isso, prefira acessar as docs localmente
# na VPS (http://127.0.0.1:8020/docs). Deixe comentado se não precisar.
