# AudazSquad — backend (API + Postgres) em Docker.
# O frontend NÃO está aqui: ele é buildado e servido pelo nginx da VPS.
#
# Produção (VPS): a API vem pronta do GitHub Container Registry (ghcr).
#   docker compose pull && docker compose up -d
# Desenvolvimento (local): builda a imagem a partir de ./backend.
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audaz}
      POSTGRES_DB: ${POSTGRES_DB:-audaz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audaz}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Em produção o Actions publica esta imagem; na VPS é só `pull`.
    image: ghcr.io/sadraqueseucorretor-hue/audaz-squad-api:latest
    # Para desenvolver local sem registry: `docker compose up --build` builda daqui.
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-audaz}:${POSTGRES_PASSWORD:-audaz}@db:5432/${POSTGRES_DB:-audaz}
    depends_on:
      db:
        condition: service_healthy
    # Publica só no localhost da VPS; quem expõe para fora é o nginx.
    ports:
      - "127.0.0.1:8020:8000"

volumes:
  pgdata:
