[project]
name = "audaz-squad-api"
version = "0.1.0"
description = "Backend FastAPI da AudazSquad — integração nativa com o Bora Vender (Direcional)."
authors = [{ name = "Yago Freire", email = "freireyago51@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pydantic (>=2.8.0,<3.0.0)",
    "pydantic-settings (>=2.4.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.30,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "bcrypt (>=4.1.0,<5.0.0)",
]

[tool.poetry]
# O nome do projeto é "audaz-squad-api", mas o código mora na pasta "app".
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
